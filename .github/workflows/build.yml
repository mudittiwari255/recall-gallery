name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.13"
  MODEL_REPO: onnx-community/embeddinggemma-2-ONNX

jobs:
  parity:
    name: Check search engine against reference
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }

      - name: Download model
        run: |
          set -euo pipefail
          dir="models/$MODEL_REPO"
          for f in config.json tokenizer.json tokenizer_config.json processor_config.json preprocessor_config.json \
                   chat_template.jinja config_sentence_transformers.json \
                   onnx/model_q4.onnx onnx/model_q4.onnx_data onnx/vision_encoder_q4.onnx onnx/vision_encoder_q4.onnx_data; do
            if [ ! -s "$dir/$f" ]; then
              mkdir -p "$(dirname "$dir/$f")"
              curl -fsSL --retry 5 -o "$dir/$f" "https://huggingface.co/$MODEL_REPO/resolve/main/$f" || echo "skip $f"
            fi
          done
          ls -la "$dir" "$dir/onnx"

      - name: Test images
        run: |
          set -euo pipefail
          mkdir -p testimg
          curl -fsSL -o testimg/cats.jpg https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/main/cats.jpg
          pip install --quiet pillow
          python3 -c "from PIL import Image; im=Image.open('testimg/cats.jpg').convert('RGB'); w,h=im.size; im.crop((0,0,w//3,h)).save('testimg/portrait.png')"

      - name: Reference outputs (Transformers.js)
        working-directory: tools/reference
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/logs"
          npm install --no-audit --no-fund
          node reference.mjs "$GITHUB_WORKSPACE/models" "$GITHUB_WORKSPACE/reference.json" \
            "$GITHUB_WORKSPACE/testimg/cats.jpg" "$GITHUB_WORKSPACE/testimg/portrait.png" 2>&1 | tee "$GITHUB_WORKSPACE/logs/reference.log"

      - name: Kotlin engine vs reference
        env:
          MODEL_DIR: ${{ github.workspace }}/models/${{ env.MODEL_REPO }}
          REFERENCE_JSON: ${{ github.workspace }}/reference.json
        run: |
          set -o pipefail
          mkdir -p logs
          gradle :core:test --no-daemon --stacktrace 2>&1 | tee logs/core-test.log

      - name: Publish logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/publish-logs.sh ci-logs-parity

  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - name: Assemble
        run: |
          set -o pipefail
          mkdir -p logs
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee logs/assemble.log
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk recall-gallery.apk
      - uses: actions/upload-artifact@v7
        with:
          name: recall-gallery-apk
          path: recall-gallery.apk
      - name: Publish logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/publish-logs.sh ci-logs-apk

  play:
    name: Build Play Store bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEY_PASSWORD != '' }}
      HAS_PLAY_ACCESS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: "${{ env.GRADLE_VERSION }}" }
      - name: Unsigned bundle (no upload key secret yet)
        if: env.HAS_UPLOAD_KEY != 'true'
        env:
          UNSIGNED_BUNDLE: "1"
        run: |
          set -euo pipefail
          mkdir -p logs
          gradle :app:bundleRelease --no-daemon --stacktrace 2>&1 | tee logs/bundle.log
          # Hand the unsigned bundle over on a branch, to be signed with the upload key outside GitHub
          mkdir -p handoff
          cp app/build/outputs/bundle/release/app-release.aab "handoff/recall-gallery-unsigned.aab"
          echo "run ${GITHUB_RUN_NUMBER} sha ${GITHUB_SHA}" > handoff/RUN.txt
          cd handoff && git init -q && git checkout -q -b play-unsigned && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Unsigned bundle for run ${GITHUB_RUN_NUMBER}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" play-unsigned
      - name: Bundle (signed with the upload key)
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p logs
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in keystore/upload.jks.enc \
            -out "$RUNNER_TEMP/upload.jks" -pass env:UPLOAD_KEYSTORE_PASSWORD
          export UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          gradle :app:bundleRelease --no-daemon --stacktrace 2>&1 | tee logs/bundle.log
          cp app/build/outputs/bundle/release/app-release.aab recall-gallery.aab
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v7
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: recall-gallery-aab
          path: recall-gallery.aab
      - name: Upload to Play (internal testing)
        if: env.HAS_UPLOAD_KEY == 'true' && env.HAS_PLAY_ACCESS == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.prasanglabs.recall
          releaseFiles: recall-gallery.aab
          track: internal
          # "draft" until the app has been published once; then set the PLAY_RELEASE_STATUS variable to "completed"
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
      - name: Publish logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/publish-logs.sh ci-logs-play

  release:
    name: Publish release
    needs: [parity, apk, play]
    runs-on: ubuntu-24.04
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --name recall-gallery-apk
          files="recall-gallery.apk"
          if gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --name recall-gallery-aab; then
            files="$files recall-gallery.aab"
          fi
          tag="build-${{ github.run_number }}"
          gh release create "$tag" $files \
            --repo "${{ github.repository }}" \
            --title "Recall Gallery (build ${{ github.run_number }})" \
            --notes "Install on your phone: tap recall-gallery.apk, then allow installing from your browser. recall-gallery.aab (when present) is for uploading to Google Play, not for installing. Built from ${{ github.sha }}." \
            --latest
